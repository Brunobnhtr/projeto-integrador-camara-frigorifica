# Configuração do Wokwi para VS Code — Projeto Integrador · Câmara Frigorífica
#
# Para rodar:
#   1. Compile:  .\compilar.ps1
#   2. Abra o diagram.json no VS Code
#   3. F1 → "Wokwi: Start Simulator"
#
# Na primeira vez o Wokwi pede uma licença gratuita:
#   F1 → "Wokwi: Request a New License" (abre o navegador, é grátis)

[wokwi]
version = 1
firmware = "build/sketch.ino.hex"
elf = "build/sketch.ino.elf"
