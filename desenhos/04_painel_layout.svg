    <circle cx="935" cy="335" r="11" fill="#ffa8a8" stroke="#c92a2a" stroke-width="2"/>
    <text x="935" y="362" font-size="9" font-weight="700" fill="#c92a2a" text-anchor="middle">H4 FALHA</text>
  </g>

