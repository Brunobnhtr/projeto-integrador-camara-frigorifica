<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1120" height="790" fill="#ffffff"/>

  <text x="60" y="40" font-size="23" font-weight="700" fill="#111">PAINEL DE COMANDO — LAYOUT</text>
  <text x="60" y="63" font-size="13" fill="#555">400 × 500 × 200 mm · escala 1:1 · cotas em milímetros · origem no canto inferior esquerdo</text>

  <text x="280" y="96" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">FUNDO (backplate) — vista interna</text>
  <text x="820" y="96" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">PORTA — vista externa</text>

  <!-- ==================== BACKPLATE ==================== -->
  <rect x="80" y="110" width="400" height="500" fill="#f1f3f5" stroke="#212529" stroke-width="2.5"/>

  <!-- canaletas verticais -->
