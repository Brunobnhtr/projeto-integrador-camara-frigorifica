  <!-- ==================== NOTAS ==================== -->
  <g font-size="12">
    <rect x="60" y="678" width="1000" height="88" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="76" y="698" font-weight="700" fill="#8a6d00">⚠ VERIFICAR ANTES DE FURAR</text>
    <text x="76" y="718" font-size="11" fill="#5c4a00">1 · A emergência (2 blocos empilhados) ocupa ~70 mm atrás da porta e fica em frente ao TRILHO 2. Confirme que não há colisão — se houver, mova S0 para X = 60.</text>
    <text x="76" y="736" font-size="11" fill="#5c4a00">2 · Imprima um gabarito 1:1 desta porta em A3, cole sobre o MDF e fure através dele.  ·  3 · Grupos A (potência) e C (sinais) SEMPRE em canaletas opostas.</text>
    <text x="76" y="754" font-size="11" font-weight="700" fill="#c92a2a">4 · ANTENA: conector SMA de painel na LATERAL DIREITA, parte alta. NUNCA passe o pigtail coaxial por prensa-cabo — o aperto esmaga o dielétrico e destrói o alcance.</text>
  </g>
