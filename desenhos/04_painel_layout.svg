  <rect x="450" y="110" width="30" height="500" fill="#dfe6e9" stroke="#7f8c8d" stroke-width="1"/>
  <text x="95" y="370" font-size="10" fill="#5d6d7e" text-anchor="middle" transform="rotate(-90 95 370)">CANALETA · GRUPO A (potência)</text>
  <text x="465" y="370" font-size="10" fill="#5d6d7e" text-anchor="middle" transform="rotate(-90 465 370)">CANALETA · GRUPO C (sinais)</text>

