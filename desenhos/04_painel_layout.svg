    <text x="172" y="379" font-size="8" fill="#155724" text-anchor="middle">D5 / D4 / A0</text>
    <rect x="230" y="326" width="105" height="58" fill="#f8d7da" stroke="#c92a2a" stroke-width="1.5"/>
