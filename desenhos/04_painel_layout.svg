  <text x="118" y="196" font-size="11" font-weight="700" fill="#2d3436">TRILHO DIN 1 — DISTRIBUIÇÃO E PROTEÇÃO</text>
  <g>
    <rect x="120" y="196" width="18" height="56" fill="#ffe066" stroke="#b8860b" stroke-width="1.3"/>
