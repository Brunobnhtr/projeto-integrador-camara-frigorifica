<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="880" fill="#ffffff"/>

  <text x="60" y="40" font-size="23" font-weight="700" fill="#111">POSTE DE DISTRIBUIÇÃO — DETALHE CONSTRUTIVO</text>
  <text x="60" y="63" font-size="13" fill="#555">Escala 2:1 · cotas em mm · P1 leva a caixa de DERIVAÇÃO (sem conversor), P2 o T2 e P3 o T3 · linha com condutores ENCAPADOS</text>

  <!-- ============ POSTE ============ -->
  <!-- tubo -->
  <rect x="292" y="60" width="16" height="600" fill="#c9ccd0" stroke="#495057" stroke-width="2"/>
  <line x1="296" y1="60" x2="296" y2="660" stroke="#f1f3f5" stroke-width="2"/>
  <!-- parte enterrada -->
  <rect x="292" y="660" width="16" height="110" fill="#c9ccd0" stroke="#495057" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ============ CRUZETA (260 mm) ============ -->
  <rect x="210" y="176" width="180" height="8" fill="#dee2e6" stroke="#343a40" stroke-width="2"/>
  <!-- isoladores -->
  <g>
    <ellipse cx="230" cy="168" rx="7" ry="9" fill="#8b5e3c" stroke="#4a2f16" stroke-width="1.5"/>
    <ellipse cx="230" cy="162" rx="9" ry="3" fill="#a5714a" stroke="#4a2f16" stroke-width="1"/>
    <ellipse cx="300" cy="168" rx="7" ry="9" fill="#8b5e3c" stroke="#4a2f16" stroke-width="1.5"/>
    <ellipse cx="300" cy="162" rx="9" ry="3" fill="#a5714a" stroke="#4a2f16" stroke-width="1"/>
    <ellipse cx="370" cy="168" rx="7" ry="9" fill="#8b5e3c" stroke="#4a2f16" stroke-width="1.5"/>
    <ellipse cx="370" cy="162" rx="9" ry="3" fill="#a5714a" stroke="#4a2f16" stroke-width="1"/>
  </g>
  <!-- condutores -->
  <g stroke-width="3" fill="none">
    <path d="M110 172 Q170 178 230 160" stroke="#c0392b"/>
    <path d="M230 160 Q290 176 350 168" stroke="#c0392b"/>
    <path d="M110 178 Q180 186 300 160" stroke="#7f5f2a"/>
    <path d="M300 160 Q380 174 470 168" stroke="#7f5f2a"/>
    <path d="M110 186 Q190 196 370 160" stroke="#95a5a6"/>
    <path d="M370 160 Q420 168 470 174" stroke="#95a5a6"/>
  </g>
  <text x="120" y="150" font-size="13" font-weight="700" fill="#c0392b">R1  VERMELHO  0,75 mm²</text>
  <text x="120" y="206" font-size="13" font-weight="700" fill="#7f5f2a">R2  MARROM  0,50 mm²</text>
  <text x="120" y="228" font-size="13" font-weight="700" fill="#6c7a7d">R3  CINZA  0,50 mm²</text>
  <text x="480" y="164" font-size="12" fill="#7f4f21">→ próximo poste</text>

  <!-- nota: a iluminacao publica fica nos postes da RUA -->
  <text x="404" y="128" font-size="11" font-weight="700" fill="#8a6d00">⚠ ESTE poste NÃO tem luminária.</text>
  <text x="404" y="144" font-size="11" fill="#8a6d00">A iluminação pública fica nos postes da rua:</text>
  <text x="404" y="160" font-size="11" fill="#8a6d00">Ø 5 mm, h = 180 mm, com braço curvo.</text>

  <!-- ============ RETORNO 0 V (220 mm) ============ -->
  <rect x="270" y="256" width="60" height="8" fill="#dee2e6" stroke="#343a40" stroke-width="2"/>
  <ellipse cx="300" cy="248" rx="7" ry="9" fill="#8b5e3c" stroke="#4a2f16" stroke-width="1.5"/>
  <g stroke="#5dade2" stroke-width="4.5" fill="none">
    <path d="M110 252 Q200 266 300 242"/>
    <path d="M300 242 Q400 266 470 254"/>
  </g>
  <text x="112" y="232" font-size="13" font-weight="700" fill="#1f7bb6">0 V — RETORNO COMUM · AZUL CLARO · 1,00 mm²</text>
  <text x="112" y="290" font-size="11" fill="#1f7bb6">⚠ mais grosso: conduz a SOMA das correntes dos 3 ramais (6,9 A)</text>
  <text x="112" y="306" font-size="11" fill="#1f7bb6">40 mm abaixo da cruzeta, como o neutro numa rede real</text>

  <!-- ============ TRANSFORMADOR (165 mm) ============ -->
  <!-- corpo cilíndrico -->
  <rect x="250" y="340" width="100" height="140" rx="6" fill="#b2c9b2" stroke="#2b5c2b" stroke-width="2.5"/>
  <ellipse cx="300" cy="340" rx="50" ry="9" fill="#c6dbc6" stroke="#2b5c2b" stroke-width="2"/>
  <ellipse cx="300" cy="480" rx="50" ry="9" fill="#9dba9d" stroke="#2b5c2b" stroke-width="2"/>
  <!-- buchas de alta -->
  <g>
    <rect x="272" y="326" width="6" height="14" fill="#8b5e3c" stroke="#4a2f16" stroke-width="1"/>
    <ellipse cx="275" cy="324" rx="6" ry="3" fill="#a5714a" stroke="#4a2f16" stroke-width="1"/>
    <rect x="322" y="326" width="6" height="14" fill="#8b5e3c" stroke="#4a2f16" stroke-width="1"/>
    <ellipse cx="325" cy="324" rx="6" ry="3" fill="#a5714a" stroke="#4a2f16" stroke-width="1"/>
  </g>
  <text x="366" y="322" font-size="11" fill="#2b5c2b">buchas de alta (entrada 24 V)</text>
  <!-- janela com voltímetro -->
  <rect x="266" y="378" width="68" height="30" fill="#212529" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="399" font-size="15" font-weight="700" fill="#8ce99a" text-anchor="middle">12.0V</text>
  <text x="300" y="428" font-size="11" font-weight="700" fill="#1b4332" text-anchor="middle">P1, T2 e T3 — todos Ø50</text>
  <text x="300" y="444" font-size="10" fill="#1b4332" text-anchor="middle">centro a 165 mm do piso</text>
  <!-- furos de ventilação -->
  <g fill="#2b5c2b">
    <circle cx="266" cy="352" r="2.5"/><circle cx="282" cy="350" r="2.5"/>
    <circle cx="318" cy="350" r="2.5"/><circle cx="334" cy="352" r="2.5"/>
    <circle cx="266" cy="470" r="2.5"/><circle cx="282" cy="472" r="2.5"/>
    <circle cx="318" cy="472" r="2.5"/><circle cx="334" cy="470" r="2.5"/>
  </g>
  <text x="366" y="356" font-size="10" fill="#2b5c2b">furos Ø3 de ventilação (obrigatórios)</text>
  <!-- buchas de baixa -->
  <line x1="350" y1="462" x2="374" y2="462" stroke="#8b5e3c" stroke-width="3"/>
  <line x1="350" y1="470" x2="374" y2="470" stroke="#8b5e3c" stroke-width="3"/>
  <text x="380" y="466" font-size="11" fill="#2b5c2b">baixa → desce DENTRO do tubo até a base</text>
  <!-- cinta de fixação -->
  <rect x="246" y="356" width="108" height="7" fill="none" stroke="#6c757d" stroke-width="2"/>
  <text x="150" y="360" font-size="10" fill="#6c757d">cinta de alumínio + 2× M3</text>

  <!-- derivação do condutor -->
  <path d="M230 168 Q244 250 275 326" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M300 248 Q292 285 325 326" fill="none" stroke="#5dade2" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="140" y="336" font-size="10" font-weight="700" fill="#7f4f21">DERIVAÇÃO: janela na capa,</text>
  <text x="140" y="350" font-size="10" fill="#7f4f21">solda e termorretrátil.</text>
  <text x="140" y="364" font-size="10" font-weight="700" fill="#c0392b">NÃO corte a linha.</text>

  <!-- ============ BASE ============ -->
  <rect x="264" y="646" width="72" height="14" fill="#adb5bd" stroke="#343a40" stroke-width="2"/>
  <text x="180" y="642" font-size="11" fill="#495057">flange de fixação + 4× M3</text>
  <rect x="60" y="660" width="620" height="30" fill="#ced4da" stroke="#212529" stroke-width="2"/>
  <rect x="60" y="690" width="620" height="80" fill="#f1f3f5" stroke="#212529" stroke-width="2"/>
  <text x="370" y="682" font-size="11" fill="#495057">base MDF 12 mm (piso da maquete)</text>
  <text x="470" y="732" font-size="12" font-weight="700" fill="#495057">vão de 40 mm — fiação por baixo</text>
  <path d="M300 690 L300 745 L440 745" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="150" y="748" font-size="11" fill="#e8590c">fios saem do tubo aqui →</text>

  <!-- ============ COTAS ============ -->
  <g stroke="#c92a2a" stroke-width="1.2" fill="#c92a2a" font-size="12">
    <line x1="740" y1="60" x2="740" y2="660"/>
    <line x1="734" y1="60" x2="746" y2="60"/><line x1="734" y1="660" x2="746" y2="660"/>
    <text x="760" y="366" font-weight="700">300 (altura visível)</text>

    <line x1="700" y1="180" x2="700" y2="660"/>
    <line x1="694" y1="180" x2="706" y2="180"/><line x1="694" y1="660" x2="706" y2="660"/>
    <rect x="676" y="412" width="46" height="16" fill="#fff" stroke="none"/>
    <text x="699" y="424" text-anchor="middle" font-weight="700" font-size="11">260</text>

    <line x1="660" y1="260" x2="660" y2="660"/>
    <line x1="654" y1="260" x2="666" y2="260"/><line x1="654" y1="660" x2="666" y2="660"/>
    <rect x="636" y="452" width="46" height="16" fill="#fff" stroke="none"/>
    <text x="659" y="464" text-anchor="middle" font-weight="700" font-size="11">220</text>

    <line x1="620" y1="430" x2="620" y2="660"/>
    <line x1="614" y1="430" x2="626" y2="430"/><line x1="614" y1="660" x2="626" y2="660"/>
    <rect x="596" y="527" width="46" height="16" fill="#fff" stroke="none"/>
    <text x="619" y="549" text-anchor="middle" font-weight="700" font-size="11">165</text>

    <line x1="740" y1="660" x2="740" y2="770"/>
    <line x1="734" y1="770" x2="746" y2="770"/>
    <text x="760" y="720" font-weight="700" font-size="11">50 (encaixe)</text>

    <!-- espaçamento dos condutores -->
    <line x1="230" y1="118" x2="300" y2="118"/>
    <line x1="230" y1="112" x2="230" y2="124"/><line x1="300" y1="112" x2="300" y2="124"/>
    <text x="265" y="110" text-anchor="middle" font-weight="700" font-size="11">35</text>
    <line x1="300" y1="118" x2="370" y2="118"/>
    <line x1="370" y1="112" x2="370" y2="124"/>
    <text x="335" y="110" text-anchor="middle" font-weight="700" font-size="11">35</text>
    <line x1="210" y1="96" x2="390" y2="96"/>
    <line x1="210" y1="90" x2="210" y2="102"/><line x1="390" y1="90" x2="390" y2="102"/>
    <text x="300" y="88" text-anchor="middle" font-weight="700" font-size="11">90 (cruzeta)</text>
  </g>

  <!-- ============ DETALHE: AMARRAÇÃO ============ -->
  <g transform="translate(770,180)">
    <rect x="0" y="0" width="200" height="150" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5"/>
    <text x="100" y="22" font-size="12" font-weight="700" fill="#111" text-anchor="middle">DETALHE — AMARRAÇÃO</text>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#c0392b" stroke-width="4"/>
    <ellipse cx="100" cy="88" rx="16" ry="20" fill="#8b5e3c" stroke="#4a2f16" stroke-width="1.5"/>
    <ellipse cx="100" cy="74" rx="20" ry="6" fill="#a5714a" stroke="#4a2f16" stroke-width="1"/>
    <g stroke="#c0392b" stroke-width="1.6" fill="none">
      <path d="M84 66 Q100 78 116 66"/>
      <path d="M84 74 Q100 62 116 74"/>
      <path d="M86 70 Q100 82 114 70"/>
    </g>
    <rect x="90" y="108" width="20" height="26" fill="#dee2e6" stroke="#343a40" stroke-width="1.5"/>
    <text x="100" y="146" font-size="10" fill="#c0392b" text-anchor="middle">fio de cobre 0,2 mm em "8"</text>
  </g>

  <!-- ============ AVISOS ============ -->
  <g font-size="12">
    <rect x="770" y="352" width="200" height="192" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="785" y="374" font-weight="700" fill="#8a6d00">⚠ ATENÇÃO</text>
    <text x="785" y="396" font-size="11" fill="#5c4a00">Dentro do tubo passam vários</text>
    <text x="785" y="412" font-size="11" fill="#5c4a00">fios e o tubo é de ALUMÍNIO</text>
    <text x="785" y="428" font-size="11" fill="#5c4a00">(condutor). Use fio COM CAPA</text>
    <text x="785" y="444" font-size="11" fill="#5c4a00">e rebarbe as duas pontas.</text>
    <text x="785" y="468" font-size="11" fill="#5c4a00">O tubo NÃO faz parte de</text>
    <text x="785" y="484" font-size="11" fill="#5c4a00">nenhum circuito.</text>
    <text x="785" y="510" font-size="11" font-weight="700" fill="#c92a2a">A linha usa condutor ENCAPADO.</text>
    <text x="785" y="526" font-size="11" fill="#5c4a00">Em CC, uma ponte metálica entre</text>
    <text x="785" y="542" font-size="11" fill="#5c4a00">dois condutores é curto franco.</text>
  </g>

  <g font-size="12">
    <rect x="60" y="790" width="910" height="72" fill="#f8f9fa" stroke="#adb5bd"/>
    <text x="75" y="810" font-weight="700" fill="#111">MATERIAIS DO POSTE</text>
    <text x="75" y="830" fill="#333">Tubo de alumínio Ø 8 mm × 350 mm · Cruzeta 90 mm (isoladores a −35, 0 e +35) · Suporte do retorno 30 mm, a 220 mm</text>
    <text x="75" y="848" fill="#333">Isoladores: contas Ø 6 mm (4 por poste) · Flange de MDF 6 mm + 4× M3 · Fio RÍGIDO ENCAPADO nas 4 cores</text>
    <text x="600" y="830" fill="#333">Flecha (catenária) dos condutores: 3 a 5 mm no meio do vão</text>
    <text x="600" y="848" fill="#333">Vão entre postes: 115 mm (≈ 5,7 m em escala 1:50)</text>
  </g>
</svg>
