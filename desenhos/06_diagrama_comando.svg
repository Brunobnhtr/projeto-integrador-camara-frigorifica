<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="940" fill="#ffffff"/>

  <text x="50" y="40" font-size="23" font-weight="700" fill="#111">DIAGRAMA DE COMANDO — ACIONAMENTO EM DOIS ESTÁGIOS</text>
  <text x="50" y="63" font-size="13" fill="#555">EMERGÊNCIA trava e exige rearme · STOP corta sem travar · START e STOP normais pela IHM ou pelo painel · Projeto Integrador CF-01</text>

  <!-- ═══════════════ ESTÁGIO 1 ═══════════════ -->
  <rect x="50" y="88" width="640" height="330" fill="#fff5f5" stroke="#c92a2a" stroke-width="2.5"/>
  <rect x="50" y="88" width="640" height="30" fill="#c92a2a"/>
  <text x="370" y="109" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ESTÁGIO 1 · SEGURANÇA — trava, só a emergência derruba</text>

  <line x1="86" y1="152" x2="650" y2="152" stroke="#e8590c" stroke-width="4"/>
  <text x="78" y="146" font-size="12" font-weight="700" fill="#a63e00" text-anchor="end">+24 V</text>

  <line x1="86" y1="392" x2="650" y2="392" stroke="#212529" stroke-width="4"/>
  <text x="78" y="398" font-size="12" font-weight="700" fill="#212529" text-anchor="end">0 V</text>

  <!-- S0 emergência -->
  <line x1="180" y1="152" x2="180" y2="180" stroke="#212529" stroke-width="2.5"/>
  <circle cx="180" cy="184" r="4" fill="#212529"/>
  <circle cx="180" cy="228" r="4" fill="#212529"/>
  <line x1="166" y1="192" x2="200" y2="192" stroke="#c92a2a" stroke-width="3.5"/>
  <line x1="180" y1="192" x2="180" y2="224" stroke="#c92a2a" stroke-width="3"/>
  <path d="M194 200 L212 193" stroke="#c92a2a" stroke-width="2" fill="none"/>
  <circle cx="220" cy="190" r="9" fill="#e03131" stroke="#7a0b0b" stroke-width="2.5"/>
  <text x="240" y="188" font-size="13" font-weight="700" fill="#c92a2a">S0 — EMERGÊNCIA</text>
  <text x="240" y="205" font-size="11" fill="#7a0b0b">bloco NF · cogumelo com trava</text>
  <text x="240" y="221" font-size="10" fill="#7a0b0b">fio partido → abre → PARA (fail-safe)</text>

  <!-- nó -->
  <line x1="180" y1="228" x2="180" y2="252" stroke="#212529" stroke-width="2.5"/>
  <circle cx="180" cy="256" r="5" fill="#212529"/>
  <line x1="180" y1="256" x2="330" y2="256" stroke="#212529" stroke-width="2.5"/>

  <!-- S3 rearme -->
  <line x1="180" y1="256" x2="180" y2="278" stroke="#212529" stroke-width="2.5"/>
  <circle cx="180" cy="282" r="4" fill="#1971c2"/>
  <circle cx="180" cy="326" r="4" fill="#1971c2"/>
  <line x1="166" y1="322" x2="200" y2="322" stroke="#1971c2" stroke-width="3"/>
  <line x1="180" y1="322" x2="180" y2="326" stroke="#1971c2" stroke-width="2.5"/>
  <line x1="180" y1="282" x2="180" y2="288" stroke="#1971c2" stroke-width="2.5"/>
  <path d="M180 288 L198 310" stroke="#1971c2" stroke-width="3" fill="none"/>
  <path d="M192 302 L208 294" stroke="#1971c2" stroke-width="2" fill="none"/>
  <circle cx="214" cy="291" r="7" fill="#4dabf7" stroke="#0b4a86" stroke-width="2"/>
  <text x="234" y="290" font-size="13" font-weight="700" fill="#1971c2">S3 — REARME</text>
  <text x="234" y="306" font-size="11" fill="#0b4a86">botão AZUL · bloco NA</text>
  <text x="234" y="322" font-size="10" fill="#0b4a86">o único jeito de a energia voltar</text>

  <!-- selo KA1 -->
  <line x1="330" y1="256" x2="330" y2="278" stroke="#6741d9" stroke-width="2.5"/>
  <circle cx="330" cy="282" r="4" fill="#6741d9"/>
  <circle cx="330" cy="326" r="4" fill="#6741d9"/>
  <line x1="316" y1="322" x2="350" y2="322" stroke="#6741d9" stroke-width="3"/>
  <line x1="330" y1="322" x2="330" y2="326" stroke="#6741d9" stroke-width="2.5"/>
  <line x1="330" y1="282" x2="330" y2="288" stroke="#6741d9" stroke-width="2.5"/>
  <path d="M330 288 L348 310" stroke="#6741d9" stroke-width="3" fill="none"/>
  <text x="368" y="290" font-size="13" font-weight="700" fill="#6741d9">KA1 — contato de SELO</text>
  <text x="368" y="306" font-size="11" font-weight="700" fill="#3b1a94">⭐ é o que trava a emergência</text>
  <text x="368" y="322" font-size="10" fill="#3b1a94">perdeu o selo, só o REARME devolve</text>
  <line x1="330" y1="326" x2="330" y2="348" stroke="#6741d9" stroke-width="2.5"/>

  <!-- junção + bobina KA1 -->
  <line x1="180" y1="326" x2="180" y2="348" stroke="#212529" stroke-width="2.5"/>
  <line x1="180" y1="348" x2="330" y2="348" stroke="#212529" stroke-width="2.5"/>
  <circle cx="180" cy="348" r="5" fill="#212529"/>
  <rect x="132" y="352" width="96" height="40" fill="#e0cffc" stroke="#6741d9" stroke-width="3"/>
  <text x="180" y="372" font-size="14" font-weight="700" fill="#3b1a94" text-anchor="middle">KA1</text>
  <text x="180" y="386" font-size="9" fill="#3b1a94" text-anchor="middle">2 contatos · 24 V</text>
  <line x1="180" y1="392" x2="180" y2="392" stroke="#212529" stroke-width="2.5"/>
  <circle cx="180" cy="392" r="4" fill="#212529"/>

  <!-- ═══════════════ ESTÁGIO 2 ═══════════════ -->
  <rect x="50" y="440" width="640" height="200" fill="#fff9db" stroke="#b8860b" stroke-width="2.5"/>
  <rect x="50" y="440" width="640" height="30" fill="#b8860b"/>
  <text x="370" y="461" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ESTÁGIO 2 · PROCESSO — corta, mas NÃO trava</text>

  <line x1="86" y1="510" x2="650" y2="510" stroke="#6741d9" stroke-width="3.5"/>
  <text x="78" y="504" font-size="11" font-weight="700" fill="#3b1a94" text-anchor="end">KA1 · saída</text>

  <line x1="86" y1="614" x2="650" y2="614" stroke="#212529" stroke-width="4"/>
  <text x="78" y="620" font-size="12" font-weight="700" fill="#212529" text-anchor="end">0 V</text>

  <!-- S2 stop -->
  <line x1="230" y1="510" x2="230" y2="528" stroke="#212529" stroke-width="2.5"/>
  <circle cx="230" cy="532" r="4" fill="#212529"/>
  <circle cx="230" cy="572" r="4" fill="#212529"/>
  <line x1="216" y1="540" x2="250" y2="540" stroke="#c92a2a" stroke-width="3.5"/>
  <line x1="230" y1="540" x2="230" y2="568" stroke="#c92a2a" stroke-width="3"/>
  <path d="M244 548 L262 541" stroke="#c92a2a" stroke-width="2" fill="none"/>
  <circle cx="270" cy="538" r="7" fill="#fa5252" stroke="#7a0b0b" stroke-width="2"/>
  <text x="290" y="538" font-size="13" font-weight="700" fill="#c92a2a">S2 — STOP</text>
  <text x="290" y="554" font-size="11" fill="#7a0b0b">bloco NF em 24 V</text>
  <text x="290" y="570" font-size="10" font-weight="700" fill="#c92a2a">corta em HARDWARE, sem travar</text>

  <!-- bobina KA2 -->
  <line x1="230" y1="572" x2="230" y2="580" stroke="#212529" stroke-width="2.5"/>
  <rect x="182" y="580" width="96" height="34" fill="#ffd8a8" stroke="#c92a2a" stroke-width="3"/>
  <text x="230" y="596" font-size="14" font-weight="700" fill="#7a0b0b" text-anchor="middle">KA2</text>
  <text x="230" y="609" font-size="9" fill="#7a0b0b" text-anchor="middle">contato ≥ 10 A</text>
  <circle cx="230" cy="614" r="4" fill="#212529"/>

  <text x="470" y="596" font-size="11" fill="#5c4a00">Ao soltar o STOP, o KA2 volta.</text>
  <text x="470" y="612" font-size="11" fill="#5c4a00">Quem impede o processo de reiniciar</text>
  <text x="470" y="628" font-size="11" fill="#5c4a00">é o firmware — e isso basta aqui.</text>

  <!-- ═══════════════ POTÊNCIA ═══════════════ -->
  <rect x="730" y="88" width="420" height="330" fill="#f8f9fa" stroke="#495057" stroke-width="2.5"/>
  <rect x="730" y="88" width="420" height="30" fill="#212529"/>
  <text x="940" y="109" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">CAMINHO DA POTÊNCIA</text>

  <rect x="756" y="150" width="106" height="46" rx="4" fill="#b2c9b2" stroke="#2b5c2b" stroke-width="2"/>
  <text x="809" y="170" font-size="12" font-weight="700" fill="#1b4332" text-anchor="middle">P1 · derivação</text>
  <text x="809" y="187" font-size="11" fill="#1b4332" text-anchor="middle">24,0 V · 6,0 A</text>

  <line x1="809" y1="196" x2="809" y2="222" stroke="#c0392b" stroke-width="4"/>
  <rect x="770" y="222" width="78" height="32" fill="#ffa8a8" stroke="#c92a2a" stroke-width="2"/>
  <text x="809" y="243" font-size="12" font-weight="700" fill="#7a0b0b" text-anchor="middle">F1 · 10 A (subestação)</text>

  <line x1="809" y1="254" x2="809" y2="288" stroke="#c0392b" stroke-width="4"/>
  <circle cx="809" cy="292" r="5" fill="#c92a2a"/>
  <path d="M809 292 L845 268" stroke="#c92a2a" stroke-width="4"/>
  <circle cx="849" cy="292" r="5" fill="#c92a2a"/>
  <text x="762" y="297" font-size="11" fill="#7a0b0b" text-anchor="end">11</text>
  <text x="872" y="297" font-size="11" fill="#7a0b0b">14</text>
  <text x="829" y="256" font-size="13" font-weight="700" fill="#c92a2a" text-anchor="middle">KA2</text>

  <line x1="849" y1="292" x2="849" y2="326" stroke="#c0392b" stroke-width="4"/>
  <rect x="790" y="326" width="118" height="52" rx="4" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2"/>
  <text x="849" y="347" font-size="12" font-weight="700" fill="#7a0b0b" text-anchor="middle">BD-POT</text>
  <text x="849" y="365" font-size="10" fill="#7a0b0b" text-anchor="middle">→ BTS #1 e #2</text>

  <text x="946" y="160" font-size="11.5" font-weight="700" fill="#212529">Por que o botão não corta</text>
  <text x="946" y="176" font-size="11.5" font-weight="700" fill="#212529">a carga direto:</text>
  <text x="946" y="196" font-size="11" fill="#495057">o bloco de um botão de 22 mm</text>
  <text x="946" y="211" font-size="11" fill="#495057">aguenta ~3 A em 24 Vcc.</text>
  <text x="946" y="226" font-size="11" fill="#495057">A carga é 6,0 A em 24 Vcc.</text>
  <text x="946" y="248" font-size="11" fill="#495057">O botão corta a <tspan font-weight="700">bobina</tspan>;</text>
  <text x="946" y="263" font-size="11" fill="#495057">o relé corta a <tspan font-weight="700">carga</tspan>.</text>
  <text x="946" y="292" font-size="11" font-weight="700" fill="#c92a2a">⚠ Só o KA2 precisa de 10 A.</text>
  <text x="946" y="308" font-size="11" fill="#7a0b0b">O KA1 conduz só mA — 6 A basta.</text>

  <!-- ═══════════════ ARDUINO ═══════════════ -->
  <rect x="730" y="440" width="420" height="200" fill="#f1f6fb" stroke="#1971c2" stroke-width="2.5"/>
  <rect x="730" y="440" width="420" height="30" fill="#1971c2"/>
  <text x="940" y="461" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">O ARDUINO NÃO COMANDA RELÉ NENHUM</text>

  <text x="752" y="492" font-size="11.5" fill="#333">Ele liga e desliga o processo pelo <tspan font-weight="700">R_EN dos BTS7960</tspan>:</text>
  <text x="752" y="514" font-size="11.5" fill="#333">• START (botão físico <tspan font-weight="700">ou IHM</tspan>) → habilita o R_EN</text>
  <text x="752" y="532" font-size="11.5" fill="#333">• STOP (botão físico <tspan font-weight="700">ou IHM</tspan>) → R_EN em nível baixo</text>
  <text x="752" y="550" font-size="11.5" fill="#333">• Trip por fan parada → R_EN em nível baixo</text>

  <rect x="752" y="564" width="376" height="62" rx="5" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
  <text x="766" y="584" font-size="11" font-weight="700" fill="#8a6d00">Dois reforços de R$ 0,20 tornam esse canal confiável:</text>
  <text x="766" y="600" font-size="10.5" fill="#5c4a00">• pull-down de 10 kΩ em cada R_EN → pino solto = desligado</text>
  <text x="766" y="616" font-size="10.5" fill="#5c4a00">• watchdog de 2 s → travou, reseta, o pull-down age</text>

  <!-- ═══════════════ TABELA ═══════════════ -->
  <g font-size="12">
    <rect x="50" y="666" width="1100" height="252" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
    <text x="66" y="688" font-size="13" font-weight="700" fill="#111">O QUE ACONTECE EM CADA SITUAÇÃO</text>
    <line x1="66" y1="698" x2="1134" y2="698" stroke="#adb5bd"/>

    <text x="76" y="718" font-weight="700" fill="#495057">Situação</text>
    <text x="330" y="718" font-weight="700" fill="#495057">KA1</text>
    <text x="440" y="718" font-weight="700" fill="#495057">KA2</text>
    <text x="560" y="718" font-weight="700" fill="#495057">24 V nos BTS</text>
    <text x="760" y="718" font-weight="700" fill="#495057">Como a energia volta</text>
    <line x1="66" y1="726" x2="1134" y2="726" stroke="#adb5bd"/>

    <text x="76" y="748" fill="#333">Operação normal</text>
    <text x="330" y="748" fill="#2b8a3e">selado</text>
    <text x="440" y="748" fill="#2b8a3e">ligado</text>
    <text x="560" y="748" fill="#2b8a3e">presente</text>
    <text x="760" y="748" fill="#868e96">—</text>

    <text x="76" y="772" fill="#333" font-weight="700">STOP pressionado</text>
    <text x="330" y="772" fill="#2b8a3e">segue selado</text>
    <text x="440" y="772" fill="#c92a2a" font-weight="700">ABRE</text>
    <text x="560" y="772" fill="#c92a2a" font-weight="700">cortado em HW</text>
    <text x="760" y="772" fill="#333">soltar o STOP · religa pela IHM</text>

    <text x="76" y="796" fill="#c92a2a" font-weight="700">EMERGÊNCIA</text>
    <text x="330" y="796" fill="#c92a2a" font-weight="700">SELO PERDIDO</text>
    <text x="440" y="796" fill="#c92a2a" font-weight="700">abre</text>
    <text x="560" y="796" fill="#c92a2a" font-weight="700">cortado em HW</text>
    <text x="760" y="796" fill="#868e96">—</text>

    <text x="76" y="820" fill="#c92a2a" font-weight="700">Cogumelo destravado</text>
    <text x="330" y="820" fill="#c92a2a" font-weight="700">CONTINUA CAÍDO</text>
    <text x="440" y="820" fill="#c92a2a">continua aberto</text>
    <text x="560" y="820" fill="#c92a2a" font-weight="700">CONTINUA CORTADO</text>
    <text x="760" y="820" fill="#1971c2" font-weight="700">só com o botão REARME</text>

    <text x="76" y="844" fill="#333">REARME pressionado</text>
    <text x="330" y="844" fill="#2b8a3e">sela de novo</text>
    <text x="440" y="844" fill="#2b8a3e">liga</text>
    <text x="560" y="844" fill="#2b8a3e">disponível</text>
    <text x="760" y="844" fill="#333">processo ainda parado — dar START</text>

    <text x="76" y="868" fill="#333" font-weight="700">Saída do Arduino travada</text>
    <text x="330" y="868" fill="#2b8a3e">selado</text>
    <text x="440" y="868" fill="#333">STOP corta enquanto pressionado</text>
    <text x="760" y="868" fill="#333">—</text>

    <text x="76" y="892" fill="#c92a2a" font-weight="700">↳ solução definitiva</text>
    <text x="330" y="892" fill="#c92a2a" font-weight="700">EMERGÊNCIA trava tudo</text>
    <text x="560" y="892" fill="#c92a2a" font-weight="700">cortado e TRAVADO</text>
    <text x="760" y="892" fill="#1971c2" font-weight="700">REARME, com decisão de uma pessoa</text>
  </g>
</svg>
