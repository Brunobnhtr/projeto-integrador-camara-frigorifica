<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="1080" fill="#ffffff"/>

  <text x="50" y="40" font-size="23" font-weight="700" fill="#111">PLACA PI-1 — ESQUEMA ELÉTRICO</text>
  <text x="50" y="63" font-size="13" fill="#555">Placa de interface · 7 componentes · 4 circuitos INDEPENDENTES que só compartilham o 0 V · Projeto Integrador CF-01</text>

  <!-- ═══════════════ BORNE J1 ═══════════════ -->
  <rect x="50" y="88" width="1100" height="58" fill="#eef4fb" stroke="#1f7bb6" stroke-width="2.5"/>
  <text x="62" y="112" font-size="13" font-weight="700" fill="#1f7bb6">J1 — BORNE SUPERIOR · todos estes fios vão para o ARDUINO · 8 vias · passo 5,08 mm</text>
  <g font-size="13" font-weight="700" fill="#0b4a86" text-anchor="middle">
    <rect x="112" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="147" y="134">A0</text>
    <rect x="242" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="277" y="134">A1</text>
    <rect x="372" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="407" y="134">D2</text>
    <rect x="502" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="537" y="134">D25</text>
    <rect x="682" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="717" y="134">D9</text>
    <rect x="782" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="817" y="134">D10</text>
    <rect x="882" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="917" y="134">D11</text>
    <rect x="982" y="118" width="70" height="22" fill="#fff" stroke="#1f7bb6"/><text x="1017" y="134">D12</text>
  </g>

  <!-- ═══════════════ BLOCO A ═══════════════ -->
  <rect x="50" y="176" width="330" height="270" fill="#f4fbf6" stroke="#2b8a3e" stroke-width="2.5"/>
  <rect x="50" y="176" width="330" height="28" fill="#2b8a3e"/>
  <text x="215" y="196" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A · FILTRO DOS PINOS IS  (2 iguais)</text>

  <!-- filtro A0 -->
  <line x1="147" y1="140" x2="147" y2="250" stroke="#0b4a86" stroke-width="2.5"/>
  <circle cx="147" cy="250" r="4" fill="#0b4a86"/>
  <text x="157" y="238" font-size="12" fill="#0b4a86">nó A0</text>
  <line x1="147" y1="250" x2="147" y2="285" stroke="#333" stroke-width="2"/>
  <line x1="126" y1="285" x2="168" y2="285" stroke="#333" stroke-width="3.5"/>
  <line x1="126" y1="296" x2="168" y2="296" stroke="#333" stroke-width="3.5"/>
  <text x="178" y="295" font-size="12" font-weight="700" fill="#111">C1</text>
  <text x="178" y="310" font-size="11" fill="#555">100 nF</text>
  <line x1="147" y1="296" x2="147" y2="380" stroke="#333" stroke-width="2"/>

  <!-- filtro A1 -->
  <line x1="277" y1="140" x2="277" y2="250" stroke="#0b4a86" stroke-width="2.5"/>
  <circle cx="277" cy="250" r="4" fill="#0b4a86"/>
  <text x="287" y="238" font-size="12" fill="#0b4a86">nó A1</text>
  <line x1="277" y1="250" x2="277" y2="285" stroke="#333" stroke-width="2"/>
  <line x1="256" y1="285" x2="298" y2="285" stroke="#333" stroke-width="3.5"/>
  <line x1="256" y1="296" x2="298" y2="296" stroke="#333" stroke-width="3.5"/>
  <text x="308" y="295" font-size="12" font-weight="700" fill="#111">C2</text>
  <text x="308" y="310" font-size="11" fill="#555">100 nF</text>
  <line x1="277" y1="296" x2="277" y2="380" stroke="#333" stroke-width="2"/>

  <text x="215" y="410" font-size="11.5" fill="#2b8a3e" text-anchor="middle">Filtra o ruído que o cabo captou</text>
  <text x="215" y="428" font-size="11.5" fill="#2b8a3e" text-anchor="middle">entre o BTS7960 e o Arduino</text>

  <!-- ═══════════════ BLOCO B ═══════════════ -->
  <rect x="400" y="176" width="330" height="270" fill="#fff8ee" stroke="#e8590c" stroke-width="2.5"/>
  <rect x="400" y="176" width="330" height="28" fill="#e8590c"/>
  <text x="565" y="196" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B · DIVISOR QUE LÊ OS 24 V</text>

  <text x="418" y="243" font-size="12" font-weight="700" fill="#a63e00">J2 · 24V-POT</text>
  <line x1="418" y1="252" x2="537" y2="252" stroke="#e8590c" stroke-width="3"/>
  <rect x="512" y="252" width="50" height="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="537" y="270" font-size="11.5" font-weight="700" fill="#111" text-anchor="middle">R1 22k</text>
  <line x1="537" y1="278" x2="537" y2="308" stroke="#333" stroke-width="2"/>
  <circle cx="537" cy="308" r="5" fill="#0b4a86"/>
  <text x="548" y="303" font-size="12" font-weight="700" fill="#0b4a86">nó D25</text>

  <!-- sobe para J1 D25 -->
  <line x1="537" y1="308" x2="537" y2="140" stroke="#0b4a86" stroke-width="2.5"/>

  <!-- ramo R2 -->
  <line x1="537" y1="308" x2="472" y2="308" stroke="#333" stroke-width="2"/>
  <line x1="472" y1="308" x2="472" y2="330" stroke="#333" stroke-width="2"/>
  <rect x="447" y="330" width="50" height="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="472" y="348" font-size="11.5" font-weight="700" fill="#111" text-anchor="middle">R2 4k7</text>
  <line x1="472" y1="356" x2="472" y2="380" stroke="#333" stroke-width="2"/>

  <!-- ramo C3 -->
  <line x1="537" y1="308" x2="612" y2="308" stroke="#333" stroke-width="2"/>
  <line x1="612" y1="308" x2="612" y2="332" stroke="#333" stroke-width="2"/>
  <line x1="591" y1="332" x2="633" y2="332" stroke="#333" stroke-width="3.5"/>
  <line x1="591" y1="343" x2="633" y2="343" stroke="#333" stroke-width="3.5"/>
  <text x="643" y="342" font-size="12" font-weight="700" fill="#111">C3</text>
  <text x="643" y="357" font-size="11" fill="#555">100 nF</text>
  <line x1="612" y1="343" x2="612" y2="380" stroke="#333" stroke-width="2"/>

  <text x="565" y="410" font-size="11.5" fill="#a63e00" text-anchor="middle">R2 e C3 ficam EM PARALELO,</text>
  <text x="565" y="428" font-size="11.5" fill="#a63e00" text-anchor="middle">os dois do nó D25 para o 0 V</text>

  <!-- ═══════════════ BLOCO C ═══════════════ -->
  <rect x="750" y="176" width="400" height="270" fill="#f7f4fb" stroke="#6741d9" stroke-width="2.5"/>
  <rect x="750" y="176" width="400" height="28" fill="#6741d9"/>
  <text x="950" y="196" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C · PULL-UP DO SENSOR (1-Wire)</text>

  <text x="775" y="270" font-size="12" font-weight="700" fill="#5f3dc4">J2 · +5V</text>
  <line x1="775" y1="280" x2="900" y2="280" stroke="#6741d9" stroke-width="3"/>
  <rect x="875" y="267" width="52" height="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="901" y="285" font-size="11.5" font-weight="700" fill="#111" text-anchor="middle">R3 4k7</text>
  <line x1="927" y1="280" x2="1060" y2="280" stroke="#0b4a86" stroke-width="3"/>
  <text x="1070" y="285" font-size="12" font-weight="700" fill="#0b4a86">J1 · D2</text>

  <text x="950" y="345" font-size="11.5" fill="#5f3dc4" text-anchor="middle">Um resistor, dois pontos.</text>
  <text x="950" y="365" font-size="11.5" fill="#5f3dc4" text-anchor="middle">Não toca no 0 V.</text>
  <text x="950" y="398" font-size="11.5" fill="#555" text-anchor="middle">O barramento 1-Wire é dreno aberto:</text>
  <text x="950" y="416" font-size="11.5" fill="#555" text-anchor="middle">sem este resistor não existe comunicação.</text>

  <!-- ═══════════════ BARRAMENTO 0 V ═══════════════ -->
  <line x1="50" y1="380" x2="700" y2="380" stroke="#111" stroke-width="5"/>
  <text x="60" y="400" font-size="12.5" font-weight="700" fill="#111">BARRAMENTO 0 V — fio de cobre nu, soldado numa fileira reta de furos</text>

  <!-- ═══════════════ BLOCO D ═══════════════ -->
  <rect x="50" y="470" width="1100" height="400" fill="#fff5f5" stroke="#c92a2a" stroke-width="2.5"/>
  <rect x="50" y="470" width="1100" height="28" fill="#c92a2a"/>
  <text x="600" y="490" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">D · DRIVER DOS SINALEIROS DE 24 V — ULN2803A</text>

  <!-- CI -->
  <rect x="460" y="530" width="290" height="290" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <path d="M590 530 a15 15 0 0 0 30 0" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="605" y="700" font-size="15" font-weight="700" fill="#111" text-anchor="middle">ULN2803A</text>
  <text x="605" y="720" font-size="11" fill="#666" text-anchor="middle">8 canais Darlington</text>
  <text x="605" y="736" font-size="11" fill="#666" text-anchor="middle">diodos de proteção internos</text>

  <g font-size="12" fill="#111">
    <text x="470" y="565">1  IN1</text><text x="740" y="565" text-anchor="end">OUT1  18</text>
    <text x="470" y="592">2  IN2</text><text x="740" y="592" text-anchor="end">OUT2  17</text>
    <text x="470" y="619">3  IN3</text><text x="740" y="619" text-anchor="end">OUT3  16</text>
    <text x="470" y="646">4  IN4</text><text x="740" y="646" text-anchor="end">OUT4  15</text>
  </g>
  <g font-size="11.5" fill="#999">
    <text x="470" y="673">5  IN5</text><text x="740" y="673" text-anchor="end">OUT5  14</text>
    <text x="470" y="700">6  IN6</text><text x="740" y="700" text-anchor="end">OUT6  13</text>
    <text x="470" y="727">7  IN7</text><text x="740" y="727" text-anchor="end">OUT7  12</text>
    <text x="470" y="754">8  IN8</text><text x="740" y="754" text-anchor="end">OUT8  11</text>
  </g>
  <text x="470" y="800" font-size="12" font-weight="700" fill="#111">9  GND</text>
  <text x="740" y="800" font-size="12" font-weight="700" fill="#a63e00" text-anchor="end">COM  10</text>

  <!-- entradas -->
  <g stroke="#0b4a86" stroke-width="2.5" fill="none">
    <path d="M717 140 L717 520 L300 520 L300 560 L460 560"/>
    <path d="M817 140 L817 512 L280 512 L280 587 L460 587"/>
    <path d="M917 140 L917 504 L260 504 L260 614 L460 614"/>
    <path d="M1017 140 L1017 496 L240 496 L240 641 L460 641"/>
  </g>
  <g font-size="11.5" font-weight="700" fill="#0b4a86">
    <text x="180" y="556">J1 · D9</text>
    <text x="170" y="583">J1 · D10</text>
    <text x="160" y="610">J1 · D11</text>
    <text x="150" y="637">J1 · D12</text>
  </g>

  <!-- saidas -->
  <g stroke="#c92a2a" stroke-width="2.5" fill="none">
    <path d="M750 560 L900 560"/><path d="M750 587 L900 587"/>
    <path d="M750 614 L900 614"/><path d="M750 641 L900 641"/>
  </g>
  <g font-size="11.5" font-weight="700">
    <text x="910" y="565" fill="#2b8a3e">J2 · L1−  (verde · COOL)</text>
    <text x="910" y="592" fill="#1f7bb6">J2 · L2−  (azul · HEAT)</text>
    <text x="910" y="619" fill="#e8590c">J2 · L3−  (amarelo · alarme)</text>
    <text x="910" y="646" fill="#c92a2a">J2 · L4−  (vermelho · FAULT)</text>
  </g>

  <!-- GND e COM -->
  <line x1="460" y1="795" x2="330" y2="795" stroke="#111" stroke-width="2.5"/>
  <line x1="330" y1="795" x2="330" y2="840" stroke="#111" stroke-width="2.5"/>
  <line x1="290" y1="840" x2="370" y2="840" stroke="#111" stroke-width="5"/>
  <text x="380" y="845" font-size="12" font-weight="700" fill="#111">0 V</text>

  <line x1="750" y1="795" x2="900" y2="795" stroke="#e8590c" stroke-width="3"/>
  <text x="910" y="800" font-size="12" font-weight="700" fill="#a63e00">J2 · 24V-SRV  (24 V permanente)</text>
  <text x="910" y="818" font-size="11" fill="#a63e00">⚠ o pino 10 referencia os diodos internos</text>

  <text x="605" y="855" font-size="11.5" fill="#c92a2a" text-anchor="middle">O positivo dos sinaleiros vai DIRETO do BD-24V às lâmpadas — não passa pela placa</text>

  <!-- ═══════════════ BORNE J2 ═══════════════ -->
  <rect x="50" y="900" width="1100" height="58" fill="#fdf3ee" stroke="#e8590c" stroke-width="2.5"/>
  <text x="62" y="924" font-size="13" font-weight="700" fill="#a63e00">J2 — BORNE INFERIOR · todos estes fios vão para o PAINEL · 8 vias · passo 5,08 mm</text>
  <g font-size="12" font-weight="700" fill="#a63e00" text-anchor="middle">
    <rect x="72" y="930" width="88" height="22" fill="#fff" stroke="#e8590c"/><text x="116" y="946">+5V</text>
    <rect x="182" y="930" width="88" height="22" fill="#fff" stroke="#e8590c"/><text x="226" y="946">0V</text>
    <rect x="292" y="930" width="118" height="22" fill="#fff" stroke="#e8590c"/><text x="351" y="946">24V-POT</text>
    <rect x="432" y="930" width="118" height="22" fill="#fff" stroke="#e8590c"/><text x="491" y="946">24V-SRV</text>
    <rect x="600" y="930" width="88" height="22" fill="#fff" stroke="#e8590c"/><text x="644" y="946">L1−</text>
    <rect x="710" y="930" width="88" height="22" fill="#fff" stroke="#e8590c"/><text x="754" y="946">L2−</text>
    <rect x="820" y="930" width="88" height="22" fill="#fff" stroke="#e8590c"/><text x="864" y="946">L3−</text>
    <rect x="930" y="930" width="88" height="22" fill="#fff" stroke="#e8590c"/><text x="974" y="946">L4−</text>
  </g>

  <!-- ═══════════════ AVISOS ═══════════════ -->
  <rect x="50" y="978" width="1100" height="78" fill="#fffbe6" stroke="#f5a524" stroke-width="2"/>
  <text x="66" y="1000" font-size="12.5" font-weight="700" fill="#8a5a00">⚠  AS DUAS VIAS DE 24 V TÊM ORIGENS DIFERENTES — TROCÁ-LAS QUEBRA O PROJETO</text>
  <text x="66" y="1020" font-size="12" fill="#6b4700">24V-POT vem do BD-POT (comutado pelo KA2, cai na emergência) → alimenta só o divisor de medição.</text>
  <text x="66" y="1038" font-size="12" fill="#6b4700">24V-SRV vem do BD-24V (permanente) → alimenta o COM do CI, para o sinaleiro de FALHA continuar aceso na emergência. Use anilhas de cores diferentes.</text>
</svg>
