<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="940" fill="#ffffff"/>

  <text x="40" y="36" font-size="22" font-weight="700" fill="#111">PLACA PI-1 — DIAGRAMA DE LIGAÇÃO (vista de cima)</text>
  <text x="40" y="58" font-size="13" fill="#555">Onde cada componente fica e por onde cada fio corre · placa ilhada 45 × 75 mm (17 × 29 furos) · Projeto Integrador CF-01</text>

  <!-- ════════ PLACA ════════ -->
  <rect x="42" y="88" width="452" height="768" rx="6" fill="#f3f0e4" stroke="#9a8f6a" stroke-width="3"/>

  <!-- grade de furos -->
  <g fill="#c9bfa0">
    <circle cx="60" cy="120" r="2.4"/><circle cx="86" cy="120" r="2.4"/><circle cx="112" cy="120" r="2.4"/><circle cx="138" cy="120" r="2.4"/><circle cx="164" cy="120" r="2.4"/><circle cx="190" cy="120" r="2.4"/><circle cx="216" cy="120" r="2.4"/><circle cx="242" cy="120" r="2.4"/><circle cx="268" cy="120" r="2.4"/><circle cx="294" cy="120" r="2.4"/><circle cx="320" cy="120" r="2.4"/><circle cx="346" cy="120" r="2.4"/><circle cx="372" cy="120" r="2.4"/><circle cx="398" cy="120" r="2.4"/><circle cx="424" cy="120" r="2.4"/><circle cx="450" cy="120" r="2.4"/><circle cx="476" cy="120" r="2.4"/>
    <circle cx="60" cy="796" r="2.4"/><circle cx="86" cy="796" r="2.4"/><circle cx="112" cy="796" r="2.4"/><circle cx="138" cy="796" r="2.4"/><circle cx="164" cy="796" r="2.4"/><circle cx="190" cy="796" r="2.4"/><circle cx="216" cy="796" r="2.4"/><circle cx="242" cy="796" r="2.4"/><circle cx="268" cy="796" r="2.4"/><circle cx="294" cy="796" r="2.4"/><circle cx="320" cy="796" r="2.4"/><circle cx="346" cy="796" r="2.4"/><circle cx="372" cy="796" r="2.4"/><circle cx="398" cy="796" r="2.4"/><circle cx="424" cy="796" r="2.4"/><circle cx="450" cy="796" r="2.4"/><circle cx="476" cy="796" r="2.4"/>
  </g>
  <text x="500" y="124" font-size="10.5" fill="#8a7f5f">furos a cada 2,54 mm</text>

  <!-- ════════ J1 ════════ -->
  <rect x="42" y="140" width="452" height="46" fill="#1f7bb6"/>
  <text x="268" y="158" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">J1 · BORNE 8 VIAS — TODOS ESTES FIOS VÃO PARA O ARDUINO</text>
  <g font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="60" y="179">A0</text><text x="112" y="179">A1</text><text x="164" y="179">D2</text><text x="216" y="179">D25</text>
    <text x="268" y="179">D9</text><text x="320" y="179">D10</text><text x="372" y="179">D11</text><text x="424" y="179">D12</text>
  </g>

  <!-- ════════ J2 ════════ -->
  <rect x="42" y="782" width="452" height="46" fill="#e8590c"/>
  <text x="268" y="800" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">J2 · BORNE 8 VIAS — TODOS ESTES FIOS VÃO PARA O PAINEL</text>
  <g font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="60" y="821">0V</text><text x="112" y="821">+5V</text><text x="164" y="821">24V-POT</text><text x="216" y="821">24V-SRV</text>
    <text x="268" y="821">L1−</text><text x="320" y="821">L2−</text><text x="372" y="821">L3−</text><text x="424" y="821">L4−</text>
  </g>

  <!-- ════════ BARRAMENTO 0 V ════════ -->
  <line x1="55" y1="744" x2="465" y2="744" stroke="#111" stroke-width="7"/>
  <text x="475" y="740" font-size="11" font-weight="700" fill="#111">0 V</text>
  <text x="475" y="754" font-size="9.5" fill="#555">fio nu</text>

  <!-- ════════ FIOS 0 V ════════ -->
  <g stroke="#111" stroke-width="2.5" fill="none">
    <path d="M60 276 L60 744"/>
    <path d="M86 276 L86 744"/>
    <path d="M320 458 L320 744"/>
    <path d="M372 406 L372 744"/>
    <path d="M190 692 L172 692 L172 744"/>
    <path d="M60 782 L60 744"/>
  </g>

  <!-- ════════ SINAIS DO ARDUINO (azul) ════════ -->
  <g stroke="#1f7bb6" stroke-width="2.5" fill="none">
    <path d="M60 186 L60 224"/>
    <path d="M112 186 L112 210 L86 210 L86 224"/>
    <path d="M164 186 L164 224"/>
    <path d="M216 186 L216 354"/>
    <path d="M268 186 L268 240 L150 240 L150 484 L190 484"/>
    <path d="M320 186 L320 258 L140 258 L140 510 L190 510"/>
    <path d="M372 186 L372 276 L130 276 L130 536 L190 536"/>
    <path d="M424 186 L424 294 L120 294 L120 562 L190 562"/>
  </g>

  <!-- ════════ +5 V (roxo) ════════ -->
  <path d="M112 782 L112 766 L96 766 L96 700 L164 700 L164 328" stroke="#6741d9" stroke-width="2.5" fill="none"/>

  <!-- ════════ 24 V (laranja) ════════ -->
  <g stroke="#e8590c" stroke-width="2.5" fill="none">
    <path d="M164 782 L164 766 L200 766 L200 720 L216 720 L216 458"/>
    <path d="M216 782 L216 770 L246 770 L246 712 L268 712 L268 692"/>
  </g>

  <!-- ════════ SAIDAS DOS SINALEIROS (vermelho) ════════ -->
  <g stroke="#c92a2a" stroke-width="2.5" fill="none">
    <path d="M268 484 L300 484 L300 782"/>
    <path d="M268 510 L336 510 L336 782"/>
    <path d="M268 536 L388 536 L388 782"/>
    <path d="M268 562 L440 562 L440 782"/>
  </g>

  <!-- ════════ JUMPER DO NÓ D25 ════════ -->
  <path d="M216 354 L372 354" stroke="#1f7bb6" stroke-width="2.5" fill="none"/>
  <circle cx="216" cy="354" r="4.5" fill="#1f7bb6"/>
  <circle cx="320" cy="354" r="4.5" fill="#1f7bb6"/>
  <circle cx="372" cy="354" r="4.5" fill="#1f7bb6"/>
  <text x="300" y="344" font-size="10.5" font-weight="700" fill="#0b4a86">nó D25</text>

  <!-- ════════ COMPONENTES ════════ -->
  <!-- C1 -->
  <rect x="49" y="230" width="22" height="40" rx="9" fill="#e8b84b" stroke="#7a5c00" stroke-width="2"/>
  <text x="60" y="255" font-size="9" font-weight="700" fill="#3d2e00" text-anchor="middle">C1</text>
  <text x="24" y="222" font-size="10" fill="#7a5c00">100n</text>
  <!-- C2 -->
  <rect x="75" y="230" width="22" height="40" rx="9" fill="#e8b84b" stroke="#7a5c00" stroke-width="2"/>
  <text x="86" y="255" font-size="9" font-weight="700" fill="#3d2e00" text-anchor="middle">C2</text>
  <!-- R3 -->
  <rect x="152" y="242" width="24" height="60" rx="3" fill="#d9e6f2" stroke="#0b4a86" stroke-width="2"/>
  <text x="164" y="268" font-size="9" font-weight="700" fill="#0b4a86" text-anchor="middle">R3</text>
  <text x="164" y="282" font-size="8.5" fill="#0b4a86" text-anchor="middle">4k7</text>
  <!-- R1 -->
  <rect x="204" y="372" width="24" height="60" rx="3" fill="#d9e6f2" stroke="#0b4a86" stroke-width="2"/>
  <text x="216" y="398" font-size="9" font-weight="700" fill="#0b4a86" text-anchor="middle">R1</text>
  <text x="216" y="412" font-size="8.5" fill="#0b4a86" text-anchor="middle">22k</text>
  <!-- R2 -->
  <rect x="308" y="372" width="24" height="60" rx="3" fill="#d9e6f2" stroke="#0b4a86" stroke-width="2"/>
  <text x="320" y="398" font-size="9" font-weight="700" fill="#0b4a86" text-anchor="middle">R2</text>
  <text x="320" y="412" font-size="8.5" fill="#0b4a86" text-anchor="middle">4k7</text>
  <!-- C3 -->
  <rect x="361" y="360" width="22" height="40" rx="9" fill="#e8b84b" stroke="#7a5c00" stroke-width="2"/>
  <text x="372" y="384" font-size="9" font-weight="700" fill="#3d2e00" text-anchor="middle">C3</text>

  <!-- ════════ SOQUETE DIP-18 ════════ -->
  <rect x="176" y="466" width="106" height="240" rx="4" fill="#2b2b2b" stroke="#000" stroke-width="2"/>
  <path d="M214 466 a15 15 0 0 0 30 0" fill="#f3f0e4" stroke="#000" stroke-width="2"/>
  <text x="229" y="600" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">ULN2803A</text>
  <text x="229" y="616" font-size="9" fill="#bbb" text-anchor="middle">em soquete</text>
  <text x="229" y="630" font-size="9" fill="#bbb" text-anchor="middle">DIP-18</text>
  <g fill="#d0d0d0">
    <circle cx="190" cy="484" r="4"/><circle cx="190" cy="510" r="4"/><circle cx="190" cy="536" r="4"/><circle cx="190" cy="562" r="4"/>
    <circle cx="190" cy="588" r="4"/><circle cx="190" cy="614" r="4"/><circle cx="190" cy="640" r="4"/><circle cx="190" cy="666" r="4"/><circle cx="190" cy="692" r="4"/>
    <circle cx="268" cy="484" r="4"/><circle cx="268" cy="510" r="4"/><circle cx="268" cy="536" r="4"/><circle cx="268" cy="562" r="4"/>
    <circle cx="268" cy="588" r="4"/><circle cx="268" cy="614" r="4"/><circle cx="268" cy="640" r="4"/><circle cx="268" cy="666" r="4"/><circle cx="268" cy="692" r="4"/>
  </g>
  <g font-size="9" fill="#fff">
    <text x="196" y="487">1</text><text x="196" y="513">2</text><text x="196" y="539">3</text><text x="196" y="565">4</text><text x="196" y="695">9</text>
  </g>
  <g font-size="9" fill="#fff" text-anchor="end">
    <text x="262" y="487">18</text><text x="262" y="513">17</text><text x="262" y="539">16</text><text x="262" y="565">15</text><text x="262" y="695">10</text>
  </g>
  <text x="229" y="458" font-size="10" font-weight="700" fill="#c92a2a" text-anchor="middle">▲ chanfro deste lado</text>

  <!-- ════════ LEGENDA ════════ -->
  <rect x="530" y="88" width="720" height="330" fill="#fafafa" stroke="#ccc" stroke-width="2"/>
  <text x="548" y="116" font-size="14" font-weight="700" fill="#111">LEGENDA DOS FIOS</text>
  <g stroke-width="4">
    <line x1="552" y1="142" x2="596" y2="142" stroke="#1f7bb6"/>
    <line x1="552" y1="172" x2="596" y2="172" stroke="#111" stroke-width="6"/>
    <line x1="552" y1="202" x2="596" y2="202" stroke="#6741d9"/>
    <line x1="552" y1="232" x2="596" y2="232" stroke="#e8590c"/>
    <line x1="552" y1="262" x2="596" y2="262" stroke="#c92a2a"/>
  </g>
  <g font-size="12.5" fill="#333">
    <text x="608" y="147">Sinal do Arduino (0,25 mm²)</text>
    <text x="608" y="177">Barramento 0 V — fio de cobre NU, soldado esticado</text>
    <text x="608" y="207">+5 V — alimenta só o pull-up do sensor</text>
    <text x="608" y="237">24 V — duas origens diferentes, ver aviso abaixo</text>
    <text x="608" y="267">Saída do CI para as lâmpadas da porta</text>
  </g>
  <text x="548" y="305" font-size="12.5" fill="#555">Na placa ilhada os fios correm por BAIXO, isolados —</text>
  <text x="548" y="325" font-size="12.5" fill="#555">cruzamentos são normais e não causam curto.</text>
  <text x="548" y="357" font-size="12.5" font-weight="700" fill="#2b8a3e">Ordem de solda:  1) bornes  ·  2) fio nu do 0 V  ·  3) soquete</text>
  <text x="548" y="377" font-size="12.5" font-weight="700" fill="#2b8a3e">4) resistores  ·  5) capacitores  ·  6) fios por baixo</text>
  <text x="548" y="403" font-size="12.5" font-weight="700" fill="#c92a2a">O CI só entra no soquete DEPOIS de todos os testes.</text>

  <!-- ════════ TABELA DE LIGACOES ════════ -->
  <rect x="530" y="436" width="720" height="330" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <text x="548" y="462" font-size="14" font-weight="700" fill="#111">AS 17 LIGAÇÕES</text>
  <g font-size="12" fill="#333">
    <text x="548" y="488">1 · J1·A0 → C1 → barramento 0 V</text>
    <text x="548" y="510">2 · J1·A1 → C2 → barramento 0 V</text>
    <text x="548" y="532">3 · J1·D2 → R3 → J2·+5V</text>
    <text x="548" y="554">4 · J2·24V-POT → R1 → nó D25</text>
    <text x="548" y="576">5 · nó D25 → R2 → barramento 0 V</text>
    <text x="548" y="598">6 · nó D25 → C3 → barramento 0 V</text>
    <text x="548" y="620">7 · nó D25 → J1·D25</text>
    <text x="548" y="642">8 · J1·D9 → soquete pino 1</text>
    <text x="548" y="664">9 · J1·D10 → soquete pino 2</text>
    <text x="548" y="686">10 · J1·D11 → soquete pino 3</text>
    <text x="900" y="488">11 · J1·D12 → soquete pino 4</text>
    <text x="900" y="510">12 · soquete pino 9 → barramento 0 V</text>
    <text x="900" y="532">13 · soquete pino 10 → J2·24V-SRV</text>
    <text x="900" y="554">14 · soquete pino 18 → J2·L1−</text>
    <text x="900" y="576">15 · soquete pino 17 → J2·L2−</text>
    <text x="900" y="598">16 · soquete pino 16 → J2·L3−</text>
    <text x="900" y="620">17 · soquete pino 15 → J2·L4−</text>
    <text x="900" y="642">+ · J2·0V → barramento 0 V</text>
  </g>
  <text x="548" y="720" font-size="12.5" fill="#555">"nó D25" = o ponto onde R1, R2, C3 e o fio do J1·D25 se encontram.</text>
  <text x="548" y="740" font-size="12.5" fill="#555">Na placa ele é um furo só, com 4 pernas soldadas juntas.</text>

  <!-- ════════ AVISO ════════ -->
  <rect x="530" y="784" width="720" height="128" fill="#fffbe6" stroke="#f5a524" stroke-width="2.5"/>
  <text x="548" y="810" font-size="13" font-weight="700" fill="#8a5a00">⚠  POR QUE 24V-POT E 24V-SRV ESTÃO NO BORNE DE BAIXO</text>
  <text x="548" y="834" font-size="12" fill="#6b4700">Os bornes não são "entrada" e "saída" — são divididos por PARA ONDE O FIO VAI:</text>
  <text x="548" y="856" font-size="12" fill="#6b4700">J1 (cima) → tudo que vai ao ARDUINO, que fica ao lado na mesma calha.</text>
  <text x="548" y="878" font-size="12" fill="#6b4700">J2 (baixo) → tudo que vai ao PAINEL: blocos BD-5V, BD-0V, BD-POT, BD-24V e as lâmpadas da porta.</text>
  <text x="548" y="902" font-size="12" font-weight="700" fill="#a63e00">Os dois 24 V vêm de blocos do trilho 1, não do Arduino — por isso ficam em J2. E NÃO podem ser trocados entre si.</text>
</svg>
