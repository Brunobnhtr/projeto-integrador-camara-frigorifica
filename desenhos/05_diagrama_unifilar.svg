  <text x="901" y="778" font-size="10" fill="#495057" text-anchor="middle">BTS7960 #1 → 2x Peltier série</text>
  <text x="901" y="793" font-size="10" fill="#495057" text-anchor="middle">BTS7960 #2 → PTC 24 V</text>
