  <g>
    <rect x="400" y="344" width="150" height="40" rx="5" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
    <rect x="400" y="344" width="42" height="40" rx="5" fill="#e8730c" stroke="#8a4300" stroke-width="2"/>
