  </g>
  <text x="320" y="392" font-size="13" fill="#adb5bd">faixa de pedestres</text>
  <text x="320" y="278" font-size="16" font-weight="700" fill="#8a929a">R  U  A     —     V I A     P Ú B L I C A</text>

