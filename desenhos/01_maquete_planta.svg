  <g font-size="12">
    <line x1="640" y1="164" x2="672" y2="164" stroke="#c0392b" stroke-width="3"/>
    <text x="678" y="168" fill="#495057">R1 vermelho</text>
    <line x1="640" y1="180" x2="672" y2="180" stroke="#7f5f2a" stroke-width="3"/>
