    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="1100" y1="0" x2="1100" y2="500"/>
  </g>
  <text x="404" y="494" font-size="11" fill="#868e96">travessa</text>
  <text x="754" y="494" font-size="11" fill="#868e96">travessa</text>
  <text x="1104" y="494" font-size="11" fill="#868e96">travessa</text>

  <!-- ================= ZONA EXTERNA — RUA ================= -->
  <!-- calçada superior (postes de distribuição) -->
  <rect x="10" y="215" width="620" height="40" fill="#c8ccd0" stroke="#9aa2aa" stroke-width="1"/>
  <!-- pista -->
  <rect x="10" y="255" width="620" height="150" fill="#3a4046"/>
  <!-- calçada inferior (iluminação pública) -->
  <rect x="10" y="405" width="620" height="40" fill="#c8ccd0" stroke="#9aa2aa" stroke-width="1"/>
