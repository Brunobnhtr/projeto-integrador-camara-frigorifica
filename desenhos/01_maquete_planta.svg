    <path d="M150 425 q22 -6 26 -18" fill="none" stroke="#5f7288" stroke-width="2.5"/>
    <circle cx="178" cy="404" r="4.5" fill="#fff3b0" stroke="#b8860b" stroke-width="1.5"/>
    <circle cx="330" cy="425" r="5" fill="#5f7288" stroke="#212529" stroke-width="1.5"/>
    <path d="M330 425 q22 -6 26 -18" fill="none" stroke="#5f7288" stroke-width="2.5"/>
    <circle cx="358" cy="404" r="4.5" fill="#fff3b0" stroke="#b8860b" stroke-width="1.5"/>
    <circle cx="510" cy="425" r="5" fill="#5f7288" stroke="#212529" stroke-width="1.5"/>
    <path d="M510 425 q22 -6 26 -18" fill="none" stroke="#5f7288" stroke-width="2.5"/>
    <circle cx="538" cy="404" r="4.5" fill="#fff3b0" stroke="#b8860b" stroke-width="1.5"/>
  </g>
  <text x="150" y="462" font-size="12" fill="#5f7288" text-anchor="middle">iluminação pública Ø5 · h=180</text>
  <!-- pedestres -->
  <circle cx="240" cy="428" r="4" fill="#495057"/>
  <circle cx="252" cy="432" r="4" fill="#495057"/>
  <circle cx="600" cy="238" r="4" fill="#495057"/>

  <!-- ================= SUBESTAÇÃO ================= -->
  <rect x="10" y="10" width="290" height="205" fill="url(#brita)" stroke="#8d7b5f" stroke-width="2"/>
  <rect x="10" y="10" width="290" height="205" fill="none" stroke="#6c757d" stroke-width="3" stroke-dasharray="3 4"/>
  <rect x="25" y="15" width="260" height="190" fill="#c9d6e3" stroke="#1d3557" stroke-width="2.5"/>
  <text x="155" y="62" font-size="19" font-weight="700" fill="#1d3557" text-anchor="middle">SUBESTAÇÃO</text>
  <text x="155" y="86" font-size="15" fill="#1d3557" text-anchor="middle">FONTE 24 Vcc · 240 W</text>
  <text x="155" y="108" font-size="14" fill="#1d3557" text-anchor="middle">Q0 · S3 · F1 F2 F3</text>
  <rect x="70" y="124" width="170" height="30" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/>
  <text x="155" y="145" font-size="14" font-weight="700" fill="#8a6d00" text-anchor="middle">⚡ 127 V CA — 260×190</text>
  <text x="155" y="182" font-size="12" fill="#7a6a4f" text-anchor="middle">pátio com brita e cerca</text>
  <text x="14" y="-4" font-size="14" font-weight="700" fill="#8d7b5f">◄─ 1. SUBESTAÇÃO</text>

