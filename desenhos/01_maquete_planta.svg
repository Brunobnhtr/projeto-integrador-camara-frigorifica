<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -80 1650 820" width="1650" height="820" font-family="Segoe UI, Arial, sans-serif">
  <rect x="-70" y="-80" width="1650" height="820" fill="#ffffff"/>

  <text x="0" y="-42" font-size="26" font-weight="700" fill="#111">MAQUETE — PLANTA BAIXA (vista superior)</text>
  <text x="0" y="-18" font-size="14" fill="#555">Base 1500 × 500 mm · MDF 12 mm + 3 travessas · cotas em milímetros · origem no canto frontal esquerdo · a energia caminha da esquerda para a direita</text>

  <defs>
    <pattern id="zebra" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#f1c40f"/><rect x="8" width="8" height="16" fill="#212529"/>
    </pattern>
    <pattern id="brita" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d5cdbf"/>
      <circle cx="2" cy="2" r="1.2" fill="#a89478"/><circle cx="6" cy="6" r="1.2" fill="#a89478"/>
    </pattern>
    <marker id="st" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#6f42c1"/>
    </marker>
  </defs>

  <!-- ============ BASE ============ -->
  <rect x="0" y="0" width="1500" height="500" fill="#e9ecef" stroke="#212529" stroke-width="3"/>

  <!-- travessas de reforço -->
