    <line x1="640" y1="196" x2="672" y2="196" stroke="#95a5a6" stroke-width="3"/>
    <text x="678" y="200" fill="#495057">R3 cinza</text>
    <line x1="640" y1="212" x2="672" y2="212" stroke="#5dade2" stroke-width="4"/>
    <text x="678" y="216" fill="#495057">0 V azul (retorno)</text>
    <text x="640" y="152" font-size="12" font-weight="700" fill="#c92a2a">CONDUTORES ENCAPADOS</text>
  </g>

  <!-- ================= MURO / PORTÃO / GUARITA ================= -->
  <rect x="640" y="210" width="12" height="290" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
  <rect x="640" y="300" width="12" height="80" fill="#e9ecef" stroke="#1971c2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="612" y="345" font-size="13" font-weight="700" fill="#1971c2" text-anchor="middle" transform="rotate(-90 612 345)">PORTÃO 80</text>
  <text x="668" y="470" font-size="13" font-weight="700" fill="#495057" transform="rotate(-90 668 470)">MURO h=50</text>
  <rect x="660" y="255" width="45" height="45" fill="#d5dbdb" stroke="#5d6d7e" stroke-width="2"/>
  <text x="682" y="282" font-size="10" fill="#495057" text-anchor="middle">guarita</text>

  <!-- ================= PAINEL ================= -->
  <rect x="690" y="0" width="400" height="200" fill="#ced4da" stroke="#212529" stroke-width="3"/>
  <rect x="700" y="10" width="380" height="180" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="890" y="76" font-size="22" font-weight="700" fill="#212529" text-anchor="middle">PAINEL DE COMANDO</text>
  <text x="890" y="104" font-size="16" fill="#343a40" text-anchor="middle">400 × 500 × 200 mm</text>
  <text x="890" y="128" font-size="14" fill="#495057" text-anchor="middle">3 trilhos DIN · 5 blocos de distribuição</text>
  <text x="890" y="152" font-size="13" fill="#6c757d" text-anchor="middle">5 entradas separadas na base</text>
  <text x="694" y="-4" font-size="14" font-weight="700" fill="#495057">◄─ 3. PAINEL (dentro da empresa)</text>
  <!-- entradas -->
  <g>
    <circle cx="740" cy="200" r="7" fill="#c0392b" stroke="#212529" stroke-width="1.5"/>
    <circle cx="800" cy="200" r="6" fill="#e8730c" stroke="#212529" stroke-width="1.5"/>
