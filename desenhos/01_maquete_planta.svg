  <text x="1075" y="300" font-size="22" font-weight="700" fill="#6c757d" text-anchor="middle">CHÃO DE FÁBRICA</text>
  <text x="1075" y="324" font-size="14" fill="#868e96" text-anchor="middle">toda a profundidade Y à frente do painel e da câmara</text>
  <!-- corredor -->
  <line x1="690" y1="360" x2="1460" y2="360" stroke="#f1c40f" stroke-width="3"/>
  <line x1="690" y1="420" x2="1460" y2="420" stroke="#f1c40f" stroke-width="3"/>
  <text x="1075" y="394" font-size="12" fill="#8a6d00" text-anchor="middle">corredor de circulação (portão → câmara)</text>
  <!-- props -->
  <g>
    <rect x="760" y="440" width="34" height="22" fill="#c9a86a" stroke="#7f5f2a"/>
    <rect x="806" y="452" width="34" height="22" fill="#c9a86a" stroke="#7f5f2a"/>
    <text x="800" y="486" font-size="11" fill="#7f5f2a" text-anchor="middle">pallets</text>
    <rect x="900" y="444" width="48" height="20" fill="#e8730c" stroke="#8a4300"/>
    <text x="924" y="486" font-size="11" fill="#8a4300" text-anchor="middle">empilhadeira</text>
    <circle cx="1180" cy="452" r="8" fill="#2e86c1" stroke="#17466e"/>
    <circle cx="1200" cy="462" r="8" fill="#c0392b" stroke="#7a0b0b"/>
    <text x="1190" y="486" font-size="11" fill="#495057" text-anchor="middle">tambores</text>
    <rect x="1330" y="440" width="60" height="26" fill="#95a5a6" stroke="#5d6d7e"/>
    <text x="1360" y="486" font-size="11" fill="#495057" text-anchor="middle">bancada</text>
    <circle cx="1050" cy="450" r="5" fill="#495057"/>
    <circle cx="1260" cy="440" r="5" fill="#495057"/>
  </g>

  <!-- ================= COTAS ================= -->
  <g stroke="#c92a2a" stroke-width="1.5" fill="#c92a2a" font-size="14">
    <line x1="0" y1="548" x2="1500" y2="548"/>
    <line x1="0" y1="540" x2="0" y2="556"/><line x1="1500" y1="540" x2="1500" y2="556"/>
    <rect x="700" y="536" width="100" height="22" fill="#fff" stroke="none"/>
    <text x="750" y="553" text-anchor="middle" font-weight="700">1500 mm</text>

    <line x1="-32" y1="0" x2="-32" y2="500"/>
    <line x1="-40" y1="0" x2="-24" y2="0"/><line x1="-40" y1="500" x2="-24" y2="500"/>
    <text x="-46" y="250" text-anchor="middle" font-weight="700" transform="rotate(-90 -46 250)">500 mm</text>

    <line x1="360" y1="188" x2="475" y2="188"/>
    <line x1="360" y1="182" x2="360" y2="194"/><line x1="475" y1="182" x2="475" y2="194"/>
    <text x="417" y="182" text-anchor="middle" font-size="12" font-weight="700">115</text>
    <line x1="475" y1="188" x2="590" y2="188"/>
    <line x1="590" y1="182" x2="590" y2="194"/>
    <text x="532" y="182" text-anchor="middle" font-size="12" font-weight="700">115</text>

    <line x1="10" y1="588" x2="640" y2="588"/>
    <line x1="10" y1="580" x2="10" y2="596"/><line x1="640" y1="580" x2="640" y2="596"/>
    <rect x="230" y="576" width="190" height="22" fill="#fff" stroke="none"/>
    <text x="325" y="593" text-anchor="middle" font-weight="700" font-size="13">ZONA EXTERNA — 640</text>
    <line x1="652" y1="588" x2="1490" y2="588"/>
    <line x1="652" y1="580" x2="652" y2="596"/><line x1="1490" y1="580" x2="1490" y2="596"/>
    <rect x="960" y="576" width="230" height="22" fill="#fff" stroke="none"/>
    <text x="1075" y="593" text-anchor="middle" font-weight="700" font-size="13">ZONA INTERNA — 838</text>
  </g>
  <text x="-14" y="516" font-size="12" fill="#868e96">0,0</text>

  <!-- ================= LEGENDA ================= -->
  <g font-size="13">
    <rect x="0" y="620" width="1500" height="108" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5"/>
    <text x="16" y="642" font-weight="700" font-size="14" fill="#111">LEGENDA — o percurso da energia, da esquerda para a direita</text>

    <rect x="16" y="654" width="16" height="14" fill="#c9d6e3" stroke="#1d3557"/>
    <text x="40" y="666" fill="#333">1 · SUBESTAÇÃO — 127 V CA vira 24 V CC (única parte perigosa, caixa fechada)</text>

    <line x1="19" y1="686" x2="33" y2="686" stroke="#c0392b" stroke-width="3"/>
    <text x="40" y="690" fill="#333">2 · LINHA 24 V — 3 ramais encapados + retorno azul, 3 postes, 1 transformador por poste</text>

    <rect x="16" y="702" width="16" height="14" fill="#ced4da" stroke="#212529"/>
    <text x="40" y="714" fill="#333">3 · PAINEL — recebe 24 V, 5 V e 12 V AUX em 3 entradas separadas</text>

    <rect x="700" y="654" width="16" height="14" fill="#d6eaf8" stroke="#2e86c1"/>
    <text x="724" y="666" fill="#333">4 · CÂMARA FRIGORÍFICA — a carga do processo, no fundo</text>

    <rect x="700" y="676" width="16" height="14" fill="#3a4046"/>
    <text x="724" y="688" fill="#333">RUA — via pública com carros, pessoas e iluminação. Termina no portão</text>

    <rect x="700" y="698" width="16" height="14" fill="#adb5bd" stroke="#495057"/>
    <text x="724" y="710" fill="#333">MURO em X = 640 — divide "fora da empresa" de "dentro da empresa"</text>

    <text x="1090" y="666" font-weight="700" fill="#c92a2a">⚠ Condutores da linha SEMPRE encapados</text>
    <text x="1090" y="686" fill="#7a0b0b">Em CC qualquer ponte metálica é curto franco</text>
    <text x="1090" y="704" fill="#7a0b0b">e o arco não se extingue sozinho.</text>
    <text x="1090" y="722" fill="#7a0b0b">Só a malha de terra da subestação usa cobre nu.</text>
  </g>
</svg>
