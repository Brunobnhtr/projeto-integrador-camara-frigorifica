    <line x1="344" y1="224" x2="376" y2="224" stroke="#7c8b9c" stroke-width="4"/>
    <circle cx="360" cy="235" r="8" fill="#868e96" stroke="#212529" stroke-width="2"/>
    <rect x="341" y="248" width="38" height="26" rx="4" fill="#b2c9b2" stroke="#2b5c2b" stroke-width="2"/>
    <rect x="347" y="254" width="26" height="12" fill="#212529"/>
    <text x="360" y="264" font-size="9" fill="#8ce99a" text-anchor="middle">12.0V</text>
    <text x="360" y="212" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">P1</text>
    <text x="360" y="290" font-size="13" font-weight="700" fill="#1b4332" text-anchor="middle">P1 · DERIV. 24 V</text>
  </g>
  <g>
    <line x1="459" y1="224" x2="491" y2="224" stroke="#7c8b9c" stroke-width="4"/>
    <circle cx="475" cy="235" r="8" fill="#868e96" stroke="#212529" stroke-width="2"/>
    <rect x="459" y="248" width="32" height="24" rx="4" fill="#b2c9b2" stroke="#2b5c2b" stroke-width="2"/>
    <rect x="464" y="253" width="22" height="11" fill="#212529"/>
    <text x="475" y="262" font-size="8" fill="#8ce99a" text-anchor="middle">5.10V</text>
    <text x="475" y="212" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">P2</text>
    <text x="475" y="288" font-size="13" font-weight="700" fill="#1b4332" text-anchor="middle">T2 · 5 V</text>
  </g>
  <g>
    <line x1="574" y1="224" x2="606" y2="224" stroke="#7c8b9c" stroke-width="4"/>
    <circle cx="590" cy="235" r="8" fill="#868e96" stroke="#212529" stroke-width="2"/>
    <rect x="574" y="248" width="32" height="24" rx="4" fill="#b2c9b2" stroke="#2b5c2b" stroke-width="2"/>
    <rect x="579" y="253" width="22" height="11" fill="#212529"/>
    <text x="590" y="262" font-size="8" fill="#8ce99a" text-anchor="middle">12.0V</text>
    <text x="590" y="212" font-size="15" font-weight="700" fill="#212529" text-anchor="middle">P3</text>
    <text x="590" y="288" font-size="13" font-weight="700" fill="#1b4332" text-anchor="middle">T3 · 12 V AUX</text>
  </g>
  <text x="310" y="-4" font-size="14" font-weight="700" fill="#b87333">◄─ 2. LINHA 24 V · 3 POSTES · 3 TRANSFORMADORES</text>

