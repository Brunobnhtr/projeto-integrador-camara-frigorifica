  <text x="890" y="252" font-size="13" font-weight="700" fill="#8a6d00" text-anchor="middle">FAIXA ZEBRADA NR-10 — zona controlada</text>

  <!-- ================= CÂMARA ================= -->
  <rect x="1130" y="14" width="336" height="176" fill="#ffffff" stroke="#0b5394" stroke-width="3"/>
  <rect x="1138" y="22" width="320" height="160" fill="#eaf3fb" stroke="#7fb3d5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="1170" y="46" width="256" height="112" fill="#d6eaf8" stroke="#2e86c1" stroke-width="2"/>
  <text x="1298" y="80" font-size="19" font-weight="700" fill="#0b5394" text-anchor="middle">❄ CÂMARA FRIGORÍFICA</text>
  <text x="1298" y="104" font-size="14" fill="#0b5394" text-anchor="middle">336 × 176 × 326 mm</text>
  <text x="1298" y="126" font-size="13" fill="#1b4f72" text-anchor="middle">útil 200 × 100 × 250 = 5,0 L</text>
  <text x="1298" y="148" font-size="12" fill="#6c757d" text-anchor="middle">XPS 30 mm + porta dupla</text>
  <text x="1298" y="180" font-size="12" font-weight="700" fill="#0b5394" text-anchor="middle">▼ PORTA</text>
  <text x="1134" y="-4" font-size="14" font-weight="700" fill="#0b5394">◄─ 4. CÂMARA (fundo)</text>
  <!-- eletrocalha -->
  <path d="M1090 110 L1130 110" fill="none" stroke="#6f42c1" stroke-width="5" stroke-dasharray="9 5" marker-end="url(#st)"/>
  <text x="1110" y="98" font-size="11" font-weight="700" fill="#6f42c1" text-anchor="middle">eletrocalha</text>

  <!-- ================= CHÃO DE FÁBRICA ================= -->
