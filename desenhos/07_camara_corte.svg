<text x="645.0" y="500.0" font-size="13.5" fill="#111" text-anchor="start" font-weight="700">O que estas vistas mostram</text>
<circle cx="651" cy="520" r="3.6" fill="#1971c2"/>
<text x="662.0" y="524.0" font-size="11.5" fill="#111" text-anchor="start" font-weight="600">Dutos externos 40 × 40</text>
<text x="662.0" y="537.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">colados nas laterais, de Z 50 a Z 390. Ficam fora do envelope: não comem volume útil.</text>
<circle cx="651" cy="557" r="3.6" fill="#1971c2"/>
<text x="662.0" y="561.0" font-size="11.5" fill="#111" text-anchor="start" font-weight="600">Tampa do duto (CAM-21)</text>
<text x="662.0" y="574.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">fecha o topo do canal, rente com o teto. Sem ela o duto vira chaminé e a ventoinha sopra</text>
<text x="662.0" y="587.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">para o ambiente.</text>
<circle cx="651" cy="607" r="3.6" fill="#1971c2"/>
<text x="662.0" y="611.0" font-size="11.5" fill="#111" text-anchor="start" font-weight="600">Largura total 500</text>
<text x="662.0" y="624.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">420 do corpo + 40 + 40. É o "flange saliente" previsto no projeto, não uma sobra.</text>
<circle cx="651" cy="644" r="3.6" fill="#1971c2"/>
<text x="662.0" y="648.0" font-size="11.5" fill="#111" text-anchor="start" font-weight="600">Alojamento 56 × 56</text>
<text x="662.0" y="661.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">os furos M3 da ventoinha têm passo 32 — num canal de 40 não há aba. Flange com furo</text>
<text x="662.0" y="674.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">circular Ø36.</text>
<circle cx="651" cy="694" r="3.6" fill="#1971c2"/>
<text x="662.0" y="698.0" font-size="11.5" fill="#111" text-anchor="start" font-weight="600">Ar em circuito fechado</text>
<text x="662.0" y="711.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">a ventoinha sopra para cima pelo duto; o ar volta pela boca inferior. Nada de ar</text>
<text x="662.0" y="724.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">ambiente.</text>
<circle cx="651" cy="744" r="3.6" fill="#1971c2"/>
<text x="662.0" y="748.0" font-size="11.5" fill="#111" text-anchor="start" font-weight="600">Comportas separadas</text>
<text x="662.0" y="761.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">teto (exaustão) e traseira baixa (entrada) abrem só no modo renovação.</text>
<circle cx="651" cy="781" r="3.6" fill="#1971c2"/>
<text x="662.0" y="785.0" font-size="11.5" fill="#111" text-anchor="start" font-weight="600">Isolamento de 1 mm</text>
<text x="662.0" y="798.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">8 modelos de EPS, incluindo o forro dos dutos (ISO-06). Sem ele o duto vira aleta de</text>
<text x="662.0" y="811.0" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">0,32 m².</text>
<text x="45.0" y="850.0" font-size="11.5" fill="#a33a06" text-anchor="start" font-weight="600">Não liberado para corte: o vão do kit Peltier (CAM-05), o alojamento do soquete (CAM-15) e a potência do PTC estão pendentes de medição.</text>
<text x="45.0" y="868.0" font-size="11.5" fill="#a33a06" text-anchor="start" font-weight="400">Com isolante de 1 mm a câmara para em +8,1 a +9,3 °C com 30 °C de ambiente — alvo de 5 °C não atendido nesse caso. Ver RELATORIO_ENTREGA_V8.md, seção E.</text>
</svg>